server:
  port: 8081

spring:
  application:
    name: simple-order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:order_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

iam:
  auth-server-url: ${IAM_URL:http://localhost:8080}
  client-id: order-service
  client-secret: ${IAM_CLIENT_SECRET:order-service-secret}

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3060}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.joycai.orderservice: DEBUG
